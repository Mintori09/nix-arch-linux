# nvfetcher configuration for custom packages

[anyflip-downloader]
src.github = "Lofter1/anyflip-downloader"
src.prefix = "v"
fetch.url = "https://github.com/Lofter1/anyflip-downloader/releases/download/v$ver/anyflip-downloader_$ver_linux_amd64.tar.gz"

