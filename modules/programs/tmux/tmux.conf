# ---------------------------------------------------------------------
# Core
# ---------------------------------------------------------------------
unbind t

bind -r t run-shell 'tmux-popup-helper term "#{pane_current_path}" "#{window_id}" "#{session_name}"'
bind p display-popup -w 100% -h 100% -E '
tmux list-panes -F "#{pane_id} | #I.#P | #{pane_current_command} | #{pane_current_path}" |
fzf \
  --delimiter="|" \
  --preview "tmux capture-pane -pt {1}" \
  --preview-window=right:70% |
cut -d"|" -f1 |
xargs tmux select-pane -t
'

set -gq allow-passthrough on

set -as terminal-features ',xterm-256color:RGB'
set -as terminal-features ',tmux-256color:RGB'
set -as terminal-features ',*:RGB'

set -g renumber-windows on
set -g focus-events on

setw -g monitor-activity on
set -g visual-activity on
set -g visual-bell on
set -g bell-action other

setw -g allow-rename off
set -g detach-on-destroy off
set -g display-time 4000
set -g set-clipboard on

# ---------------------------------------------------------------------
# Prefix & reload
# ---------------------------------------------------------------------

unbind C-b

set -g prefix C-Space
bind C-Space send-prefix
bind C-a send-prefix

bind r source-file -q ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# ---------------------------------------------------------------------
# Pane navigation / resize
# ---------------------------------------------------------------------

# Chuyển focus & đổi thứ tự các tab / window
# bind -n C-PageUp previous-window
# bind -n C-PageDown next-window
bind -n M-h previous-window
bind -n M-l next-window
bind -r S-h previous-window
bind -r S-l next-window
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1

bind -r C-h select-pane -L
bind -r C-j select-pane -D
bind -r C-k select-pane -U
bind -r C-l select-pane -R

bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5

bind v if-shell -F '#{m:agy-*,#{session_name}}' 'split-window -h -c "#{pane_current_path}" "agy --dangerously-skip-permissions"' \
  'if-shell -F "#{m:opencode-*,#{session_name}}" "split-window -h -c \"#{pane_current_path}\" opencode" \
  "if-shell -F \"#{m:pi-*,#{session_name}}\" \"split-window -h -c \\\"#{pane_current_path}\\\" pi\" \
  \"if-shell -F \\\"#{m:lazygit-*,#{session_name}}\\\" \\\"split-window -h -c \\\\\\\"#{pane_current_path}\\\\\\\" lazygit\\\" \\\"split-window -h -c \\\\\\\"#{pane_current_path}\\\\\\\"\\\"\""'
bind s if-shell -F '#{m:agy-*,#{session_name}}' 'split-window -v -c "#{pane_current_path}" "agy --dangerously-skip-permissions"' \
  'if-shell -F "#{m:opencode-*,#{session_name}}" "split-window -v -c \"#{pane_current_path}\" opencode" \
  "if-shell -F \"#{m:pi-*,#{session_name}}\" \"split-window -v -c \\\"#{pane_current_path}\\\" pi\" \
  \"if-shell -F \\\"#{m:lazygit-*,#{session_name}}\\\" \\\"split-window -v -c \\\\\\\"#{pane_current_path}\\\\\\\" lazygit\\\" \\\"split-window -v -c \\\\\\\"#{pane_current_path}\\\\\\\"\\\"\""'
bind Y setw synchronize-panes

# ---------------------------------------------------------------------
# Session / window workflow
# ---------------------------------------------------------------------

bind C new-session
bind w if-shell -F '#{m:agy-*,#{session_name}}' 'new-window -c "#{pane_current_path}" "agy --dangerously-skip-permissions"' \
  'if-shell -F "#{m:opencode-*,#{session_name}}" "new-window -c \"#{pane_current_path}\" opencode" \
  "if-shell -F \"#{m:pi-*,#{session_name}}\" \"new-window -c \\\"#{pane_current_path}\\\" pi\" \
  \"if-shell -F \\\"#{m:lazygit-*,#{session_name}}\\\" \\\"new-window -c \\\\\\\"#{pane_current_path}\\\\\\\" lazygit\\\" \\\"new-window -c \\\\\\\"#{pane_current_path}\\\\\\\"\\\"\""'
bind o choose-tree -Zw

bind x kill-pane
bind X kill-window
bind D detach-client

bind -r ^ last-window

bind , command-prompt -I "#W" "rename-window '%%'"
bind '$' command-prompt -I "#S" "rename-session '%%'"

# ---------------------------------------------------------------------
# Copy mode - Vim style
# ---------------------------------------------------------------------

bind [ copy-mode

bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi C-v send -X rectangle-toggle
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy --trim-newline"
bind-key -T copy-mode-vi Escape send -X cancel

# ---------------------------------------------------------------------
# FZF helpers
# ---------------------------------------------------------------------

bind-key ? display-popup -E 'tmux list-keys | fzf --reverse --ansi --preview "echo {}" | cut -f 2 | xargs -I % tmux display-message "%"'

bind W display-popup -w 100% -h 100% -E '\
  tmux list-windows -a -F "#{session_name}:#{window_index}|#{window_name}|#{window_layout}" | \
  fzf --reverse --header " switch window " \
    --delimiter="|" \
    --preview "tmux capture-pane -pt {1}.0" \
    --preview-window=right:70% | \
  cut -d"|" -f1 | tr -d " " | \
  xargs tmux select-window -t'

bind S display-popup -w 100% -h 100% -E '\
  tmux list-sessions -F "#{session_name}	#{session_windows} windows	#{pane_current_path}" | \
  fzf --reverse --header " switch session · ctrl-x: kill session " \
    --delimiter="\t" \
    --preview "tmux capture-pane -ept {1} 2>/dev/null || tmux list-windows -t {1} 2>/dev/null" \
    --preview-window=right:65% \
    --bind="ctrl-x:execute-silent(tmux kill-session -t {1})+reload(tmux list-sessions -F \"#{session_name}	#{session_windows} windows	#{pane_current_path}\")" | \
  cut -f1 | \
  xargs -r tmux switch-client -t'

# ---------------------------------------------------------------------
# Popups
# ---------------------------------------------------------------------

bind -r g run-shell 'tmux-popup-helper lazygit "#{pane_current_path}" "#{window_id}" "#{session_name}" "lazygit"'

# Antigravity Hatch (Launch/Attach, Picker & Bell Forwarding)
bind -r a run-shell 'tmux-agy-hatch launch "#{pane_current_path}" "#{window_id}" "#{session_name}"'
bind -r A display-popup -w 85% -h 89% -b rounded -T " 󰚩 Antigravity Agents " -E "tmux-agy-hatch picker"
bind -r u display-popup -w 85% -h 89% -b rounded -T " 󰚩 Antigravity Agents " -E "tmux-agy-hatch picker"

set-hook -g alert-bell "run-shell -b 'tmux-agy-hatch bell #{q:hook_session_name}'"
bind -r y run-shell 'tmux-popup-helper opencode "#{pane_current_path}" "#{window_id}" "#{session_name}" "opencode"'
bind -r P run-shell 'tmux-popup-helper pi "#{pane_current_path}" "#{window_id}" "#{session_name}" "pi"'
bind -r b run-shell 'tmux-popup-helper btop "#{pane_current_path}" "#{window_id}" "#{session_name}" "btop"'

# ---------------------------------------------------------------------
# Appearance not managed by dotbar
# ---------------------------------------------------------------------

set -g pane-border-style "fg=red,bg=default"
set -g pane-active-border-style "fg=green,bg=default"

set -g window-status-current-format \
  "#[bg=#1E2633,fg=#BFBDB6,bold] #I:#W \
   #[fg=#39BAE6,bg=#1E2633]#{?window_zoomed_flag,󰊓,}\
   #[fg=#1E2633,bg=default]"

setw -g mode-style "bg=black,fg=colour154"
