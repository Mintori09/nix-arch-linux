<div class="card_inline">
  {{Image}}
  <div class="word">{{Word}}</div>
  <div class="ipa">{{IPA}} {{Audio}}</div>
  <span class="badge">{{WordClass}}</span>

  <div class="section-title">Definition</div>
  <div class="content">{{Definition}}</div>

  <div class="section-title">Meaning</div>
  <div class="content">
    <div>🇻🇳 {{Meaning_VN}}</div>
    <div>🇯🇵 {{Meaning_JP}}</div>
  </div>

  <hr />

  <div class="section-title">Example</div>
  <div class="content">
    <div class="example-en">{{Example}}</div>
    <div class="example-translation">🇻🇳 {{Example_VN}}</div>
    <div class="example-translation">🇯🇵 {{Example_JP}}</div>
  </div>

  <div class="section-title">Collocations / Synonyms</div>
  <div class="content collocations">{{Collocations}}</div>
</div>
